version: "3"
dotenv: [".env.local"]

tasks:
  install:
    desc: "Install locked project dependencies"
    cmds:
      - "uv sync --locked --dev"

  console:
    desc: "Run the voice agent in the local terminal"
    interactive: true
    cmds:
      - "lk agent console"

  dev:
    desc: "Connect the local worker to LiveKit Cloud for development"
    interactive: true
    cmds:
      - "lk agent dev"

  test:
    desc: "Run deterministic local regression tests"
    cmds:
      - "uv run python -m pytest"

  check:
    desc: "Run the same lint, format, and test checks as CI"
    cmds:
      - "uv run ruff check ."
      - "uv run ruff format --check ."
      - "uv run python -m pytest"

  simulate-text:
    desc: "Run paid LiveKit Cloud text simulations on synthetic data"
    cmds:
      - "lk agent simulate text --scenarios scenarios.yaml --concurrency 1 --yes"
